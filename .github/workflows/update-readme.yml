name: Update README

on:
  push:
  schedule:
    - cron: "0 */1 * * *"

jobs:
  markscribe:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: muesli/readme-scribe@d2f6ab32d6b9f5b59941fe782d6c7e6499a37fe4 # master, no tagged release for this
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        with:
          template: "templates/README.md.tpl"
          writeTo: "README.md"

      - uses: frdmn/age-calculator-action@v1.1
        id: birthday
        with:
          date: '1991-08-17'

      - uses: jacobtomlinson/gha-find-replace@3.0.5
        id: replace
        with:
          find: "\\$age"
          replace: "${{ steps.birthday.outputs.age }}"
          include: "README.md"

      - uses: stefanzweifel/git-auto-commit-action@v7.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit_message: Update generated README
          branch: master
